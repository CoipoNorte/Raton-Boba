<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ratón Boba · Tea Lab: un puzle de combinaciones con perlas, té y leche. Completa pedidos en la Tienda y gana propinas." />
    <meta name="theme-color" content="#b9a4f0" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Raton Boba</title>
    <style>
      html, body { height: 100%; margin: 0; background: #fff9ee; }
      #root { height: 100%; }
      .rb-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 24px;
        background: radial-gradient(700px 500px at 20% 0%, rgba(201,182,255,.55), transparent 60%),
                    radial-gradient(600px 460px at 100% 100%, rgba(184,230,164,.5), transparent 60%),
                    linear-gradient(180deg, #fff9ee, #f5eeff);
        font-family: "Nunito", ui-rounded, system-ui, sans-serif; color: #5b44a8; text-align: center;
      }
      .rb-splash svg { width: 120px; height: 120px; animation: rb-bob 1.6s ease-in-out infinite; }
      .rb-splash h1 { margin: 0; font-size: 34px; font-weight: 900; color: #5b44a8; }
      .rb-splash p { margin: 0; font-size: 16px; font-weight: 700; color: #7a6a8a; }
      .rb-splash .rb-dots { width: 180px; height: 8px; border-radius: 999px; background: #e6dcff; overflow: hidden; }
      .rb-splash .rb-dots span {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #b9a4f0, #8fbf6a);
        animation: rb-load 1.3s ease-in-out infinite;
      }
      @keyframes rb-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes rb-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .rb-splash svg, .rb-splash .rb-dots span { animation: none; }
      }
    </style>
